<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Picto Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .child-card {
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .child-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .child-card.active {
            border: 2px solid #0d6efd;
        }

        .schedule-pill {
            cursor: pointer;
        }

        .schedule-pill.active {
            background-color: #0d6efd !important;
            color: white !important;
        }

        .item-card {
            width: 140px;
        }

        .item-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .breadcrumb-nav {
            font-size: 0.95rem;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container py-4" style="max-width: 900px;">
        <h1 class="mb-4">Picto Schedule</h1>

        <!-- Add child -->
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Children</h2>
                <div id="children-list" class="d-flex flex-wrap gap-3 mb-3"></div>
                <form id="add-child-form" class="row g-2">
                    <div class="col-6 col-sm-4">
                        <input type="text" id="child-name" class="form-control" placeholder="Child's name" required>
                    </div>
                    <div class="col-6 col-sm-5">
                        <input type="text" id="child-picture" class="form-control" placeholder="Profile picture URL">
                    </div>
                    <div class="col-12 col-sm-3">
                        <button type="submit" class="btn btn-primary w-100">Add child</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Schedules for selected child -->
        <div id="schedules-section" class="card mb-4 d-none">
            <div class="card-body">
                <h2 class="h5 mb-3">Schedules for <span id="selected-child-name"></span></h2>
                <div id="schedules-list" class="d-flex flex-wrap gap-2 mb-3"></div>
                <form id="add-schedule-form" class="row g-2">
                    <div class="col-8">
                        <input type="text" id="schedule-title" class="form-control"
                            placeholder="Schedule title (e.g. Weekday routine)" required>
                    </div>
                    <div class="col-4">
                        <button type="submit" class="btn btn-outline-primary w-100">Add schedule</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Items for selected schedule -->
        <div id="items-section" class="card d-none">
            <div class="card-body">
                <h2 class="h5 mb-3">Items in <span id="selected-schedule-title"></span></h2>
                <div id="items-list" class="d-flex flex-wrap gap-3 mb-3"></div>
                <form id="add-item-form" class="row g-2">
                    <div class="col-12 col-sm-3">
                        <input type="text" id="item-label" class="form-control" placeholder="Label" required>
                    </div>
                    <div class="col-6 col-sm-3">
                        <input type="time" id="item-time" class="form-control" required>
                    </div>
                    <div class="col-6 col-sm-4">
                        <input type="text" id="item-picture" class="form-control" placeholder="Pictogram URL">
                    </div>
                    <div class="col-12 col-sm-2">
                        <button type="submit" class="btn btn-success w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let selectedChildId = null;
        let selectedScheduleId = null;

        const childrenList = document.getElementById('children-list');
        const schedulesSection = document.getElementById('schedules-section');
        const schedulesList = document.getElementById('schedules-list');
        const itemsSection = document.getElementById('items-section');
        const itemsList = document.getElementById('items-list');

        async function loadChildren() {
            const res = await fetch('/api/children');
            const children = await res.json();
            childrenList.innerHTML = '';
            children.forEach(child => {
                const card = document.createElement('div');
                card.className = 'card child-card p-2' + (child.id === selectedChildId ? ' active' : '');
                card.style.width = '120px';
                card.innerHTML = `
          <img src="${child.profilePictureUrl || 'https://via.placeholder.com/64?text=%20'}" class="item-icon mx-auto mb-1" alt="${child.name}">
          <div class="text-center small">${child.name}</div>
        `;
                card.onclick = () => selectChild(child.id, child.name);
                childrenList.appendChild(card);
            });
        }

        async function selectChild(id, name) {
            selectedChildId = id;
            selectedScheduleId = null;
            document.getElementById('selected-child-name').textContent = name;
            schedulesSection.classList.remove('d-none');
            itemsSection.classList.add('d-none');
            await loadChildren();
            await loadSchedules();
        }

        async function loadSchedules() {
            const res = await fetch(`/children/${selectedChildId}/schedules`);
            const schedules = await res.json();
            schedulesList.innerHTML = '';
            schedules.forEach(schedule => {
                const pill = document.createElement('span');
                pill.className = 'badge rounded-pill bg-light text-dark border schedule-pill p-2' +
                    (schedule.id === selectedScheduleId ? ' active' : '');
                pill.textContent = schedule.title;
                pill.onclick = () => selectSchedule(schedule.id, schedule.title);
                schedulesList.appendChild(pill);
            });
        }

        async function selectSchedule(id, title) {
            selectedScheduleId = id;
            document.getElementById('selected-schedule-title').textContent = title;
            itemsSection.classList.remove('d-none');
            await loadSchedules();
            await loadItems();
        }

        async function loadItems() {
            const res = await fetch(`/schedules/${selectedScheduleId}/items`);
            const items = await res.json();
            itemsList.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card item-card p-2 text-center';
                card.innerHTML = `
          <img src="${item.pictogramUrl || 'https://via.placeholder.com/64?text=%20'}" class="item-icon mx-auto mb-2" alt="${item.label}">
          <div class="small fw-bold">${item.timeOfDay}</div>
          <div class="small mb-2">${item.label}</div>
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        `;
                card.querySelector('button').onclick = () => deleteItem(item.id);
                itemsList.appendChild(card);
            });
        }

        async function deleteItem(itemId) {
            await fetch(`/schedules/${selectedScheduleId}/items/${itemId}`, { method: 'DELETE' });
            loadItems();
        }

        document.getElementById('add-child-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/children', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('child-name').value,
                    profilePictureUrl: document.getElementById('child-picture').value
                })
            });
            e.target.reset();
            loadChildren();
        });

        document.getElementById('add-schedule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`/children/${selectedChildId}/schedules`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: document.getElementById('schedule-title').value })
            });
            e.target.reset();
            loadSchedules();
        });

        document.getElementById('add-item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(`/schedules/${selectedScheduleId}/items`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    label: document.getElementById('item-label').value,
                    timeOfDay: document.getElementById('item-time').value,
                    pictogramUrl: document.getElementById('item-picture').value
                })
            });
            e.target.reset();
            loadItems();
        });

        loadChildren();
    </script>
</body>

</html>
